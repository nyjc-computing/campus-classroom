[tool.poetry]
name = "campus-classroom"
version = "0.1.0"
description = "Campus Classroom - Assignment Platform for Google Classroom"
authors = ["NYJC Computing <nyjc.computing@nyjc.edu.sg>"]
readme = "README.md"
packages = [{include = "apps/classroom"}]

[tool.poetry.dependencies]
# Security tier (3.11-3.13): officially supported and CI-required.
# 3.14 (bugfix tier) is not yet supported here.
python = ">=3.11,<3.14"
flask = "^3.0.0"
# WSGI server (Procfile) - was transitive via campus-suite until #993
gunicorn = "^26.2.0"
python-dotenv = "^1.2.1"
# Staff-authored prompt/passage/description markdown (text_render.py)
markdown = "^3.7"
# Post-parse HTML sanitizer for that markdown (nh3 = ammonia bindings)
nh3 = "^0.2"

# Campus internal dependencies
# Context-local session credentials (#189): the bearer and 401 hook ride
# ContextVars per request, so gthread request threads sharing one Campus
# instance can never present each other's credentials (classroom#153).
campus-api-python = {url = "https://github.com/nyjc-computing/campus-api-python/releases/download/v0.11.2/campus_api_python-0.11.2-py3-none-any.whl"}
# Flask consumer layer (flask_campus + audit middleware) - the suite is no longer a runtime dep (campus#993)
# Framework-owned Campus (#40): flask_campus's own calls (context push,
# login flow, circle probes) run on a dedicated instance, immune to
# host-side session blocks. Also brings context.is_reauth_required
# (#1096), which campus_session now imports instead of a local copy.
flask-campus = {url = "https://github.com/nyjc-computing/flask-campus/releases/download/v0.2.8/flask_campus-0.2.8-py3-none-any.whl"}
campus-common = {url = "https://github.com/nyjc-computing/campus-common/releases/download/v0.5.1/campus_common-0.5.1-py3-none-any.whl"}

[tool.pyright]
useLibraryCodeForTypes = true
exclude = [
    ".cache",
    "**/.*",
    "**/__pycache__",
    "**/node_modules",
    "**/.venv",
    "**/venv",
]

[tool.ruff.lint]
select = ['E', 'W', 'F', 'I', 'B', 'C4', 'ARG', 'SIM']
ignore = ['W291', 'W292', 'W293']

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
