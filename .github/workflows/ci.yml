name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # Config lives in pyproject.toml [tool.ruff.lint]; the repo must stay
      # green under `ruff check .` (same policy as campus-profile).
      - name: Run ruff
        uses: astral-sh/ruff-action@v3
        with:
          version: '0.16.9'

  smoke:
    name: Smoke Test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    env:
      # Dummy credentials: campus_python reads CLIENT_ID/CLIENT_SECRET at
      # import time and create_app requires SECRET_KEY; no network calls
      # happen before the smoke assertions.
      SECRET_KEY: ci-smoke
      CLIENT_ID: ci-dummy
      CLIENT_SECRET: ci-dummy
      PUBLIC_URL: http://localhost:5000
      # Env-only URL resolution (campus-common 0.3.0): no baked-in
      # topology; the app resolves service origins from the env. No
      # network calls happen before the smoke assertions.
      BASE_URL: https://campus.test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          # Configure Poetry to use system Python (not its own bundled version)
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
      - name: Install dependencies
        run: poetry install --no-root
      - name: Verify app factory and routes
        run: |
          poetry run python - <<'EOF'
          from apps.classroom import create_app

          app = create_app()
          rules = {str(rule) for rule in app.url_map.iter_rules()}
          assert "/" in rules, "landing route missing"
          print(f"App OK: {len(rules)} routes registered")
          EOF
      - name: Template invariants (novalidate on JS-handled forms, #128)
        run: poetry run python tests/test_template_invariants.py
      - name: Broker release isolation (nested session mints as the client, #168)
        run: poetry run python tests/test_broker_release_isolation.py
      - name: Gateway entry (apphost sign-in allowlist, pre-cutover forward; #169 #171)
        run: poetry run python tests/test_gateway_entry.py
      - name: No root-absolute URLs in rendered pages (gateway cutover, #170)
        run: poetry run python tests/test_no_root_absolute_urls.py
      - name: Markdown filter (prompt/passage/description rendering, #186)
        run: poetry run python tests/test_markdown_filter.py
      # test_listing_link_state.py joins here too — its step lands with the
      # file itself on the #184 envelope PR (#186 tracks the CI gap).
