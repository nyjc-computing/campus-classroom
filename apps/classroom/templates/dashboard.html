{% extends "base.html" %}

{% block title %}My Assignments - Campus Classroom{% endblock %}

{% block content %}
<div class="container-md mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">My assignments</h1>
            <p class="text-muted mb-0">Welcome, {{ g.user.email }}</p>
        </div>
        <a href="{{ url_for('assignment_new') }}" class="btn btn-primary">+ New Assignment</a>
    </div>

    <div id="assignments-container">
        <div class="text-center py-5">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading assignments...</span>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/api-errors.js') }}"></script>
<script>
// Page context: the signed-in user's id decides which rows are theirs —
// own assignments get submission counts and the submissions drill-down;
// assigned ones open on the gated /a/ page (PRD §6.9 rule 4 — #14).
const MY_ID = {{ g.user.id | tojson }};

// Course display names for the Classroom column; filled best-effort.
const COURSE_NAMES = {};

// v1 N+1 (#105): one submissions fetch per own assignment plus one
// coursework-state fetch per Classroom link (and no aggregate endpoint).
// Acceptable at staff scale; an aggregate count endpoint on the Campus
// API is the noted later optimization.
async function loadAssignments() {
    const container = document.getElementById('assignments-container');
    try {
        // Rule 4 (#14): the API computes own + assigned-to-my-courses,
        // newest first.
        const assignments = await fetchJson('/api/v1/assignments');

        if (assignments.length === 0) {
            container.innerHTML = `
                <div class="text-center py-5">
                    <h5 class="text-muted">No assignments yet</h5>
                    <p class="text-muted">
                        Assignments you create — or that a teacher assigns to
                        your Google Classroom classes — will appear here.
                    </p>
                    <a href="{{ url_for('assignment_new') }}" class="btn btn-primary">Create Assignment</a>
                </div>
            `;
            return;
        }

        // Course names and the per-assignment enrichment (N+1, see
        // above) run in parallel; both degrade on failure — names fall
        // back to course ids, counts to "—".
        const [, rows] = await Promise.all([
            fetchCourseNames(),
            Promise.all(assignments.map(async (assignment) => {
                const mine = assignment.created_by === MY_ID;
                if (!mine) {
                    return { assignment, mine, counts: null, links: [] };
                }
                const [counts, links] = await Promise.all([
                    submissionCounts(assignment.id),
                    Promise.all((assignment.classroom_links || []).map(linkWithState)),
                ]);
                return { assignment, mine, counts, links };
            })),
        ]);

        renderAssignments(container, rows);
    } catch (error) {
        if (error.expired) return;  // handleSessionExpiry is redirecting
        console.error('Error loading assignments:', error);
        container.innerHTML = `
            <div class="alert alert-danger">Failed to load assignments. Please refresh the page.</div>
        `;
    }
}

async function fetchJson(url) {
    const response = await fetch(url);
    if (!response.ok) {
        // A dead Campus grant (#98) answers 401 here: re-auth is the
        // only remedy, so redirect before any generic error UI.
        const data = await response.json().catch(() => ({}));
        const error = new Error(`Request failed (${response.status}): ${url}`);
        error.expired = handleSessionExpiry(response, data);
        throw error;
    }
    return response.json();
}

// Course display names for the Classroom column, best-effort: without
// a Classroom connection (or on any failure) links fall back to their
// course ids. Resolves once populated, so render waits for it.
async function fetchCourseNames() {
    try {
        const data = await fetchJson('/api/v1/classroom/courses');
        for (const course of data.courses || []) {
            COURSE_NAMES[course.id] = course.name || course.id;
        }
    } catch (error) {
        // Degraded names are fine (see loadAssignments).
    }
}

// Submitted / total counts for one own assignment; null degrades the
// cell (a redirecting 401 included — the navigation wins anyway).
async function submissionCounts(assignmentId) {
    try {
        const submissions = await fetchJson(
            `/api/v1/submissions/by-assignment/${encodeURIComponent(assignmentId)}`);
        return {
            submitted: submissions.filter((s) => s.submitted_at).length,
            total: submissions.length,
        };
    } catch (error) {
        return null;
    }
}

// Coursework state per link (DRAFT vs assigned): students see the post
// only after the teacher clicks Assign in the Classroom UI, so the
// badge is the "did my class get it yet" answer. Any failure degrades
// to a name-only chip.
async function linkWithState(link) {
    let state = null;
    if (link.course_id && link.coursework_id) {
        try {
            const coursework = await fetchJson(
                `/api/v1/classroom/coursework/${encodeURIComponent(link.course_id)}/${encodeURIComponent(link.coursework_id)}`);
            state = coursework.state || null;
        } catch (error) {
            // Degraded below.
        }
    }
    return { ...link, state };
}

function renderAssignments(container, rows) {
    const mine = rows.filter((row) => row.mine);
    const assigned = rows.filter((row) => !row.mine);
    const parts = [];
    if (mine.length > 0) {
        parts.push(`
            <h2 class="h5 text-muted mb-3">Created by you</h2>
            <div class="table-responsive mb-4">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th scope="col">Title</th>
                            <th scope="col">Created</th>
                            <th scope="col">Classroom</th>
                            <th scope="col">Questions</th>
                            <th scope="col">Submitted</th>
                            <th scope="col"></th>
                        </tr>
                    </thead>
                    <tbody>
                        ${mine.map(rowHtml).join('')}
                    </tbody>
                </table>
            </div>`);
    }
    if (assigned.length > 0) {
        parts.push(`
            <h2 class="h5 text-muted mb-3">Assigned to your classes</h2>
            <div class="list-group mb-4">
                ${assigned.map(assignedRowHtml).join('')}
            </div>`);
    }
    container.innerHTML = parts.join('');
}

function rowHtml({ assignment: a, counts, links }) {
    // The row's destination is the submissions drill-down (#105) — the
    // staff review surface; editing stays one click away.
    const drilldown = `/assignments/${encodeURIComponent(a.id)}/submissions`;
    return `
        <tr>
            <td>
                <a href="${drilldown}" class="text-decoration-none text-dark fw-semibold">${escapeHtml(a.title)}</a>
                ${a.description ? `<div class="text-muted small">${escapeHtml(a.description)}</div>` : ''}
            </td>
            <td class="text-nowrap">${timestamp(a.created_at)}</td>
            <td>${links.map(linkChip).join(' ') || '<span class="text-muted small">Not sent to Classroom</span>'}</td>
            <td>${a.questions.length}</td>
            <td class="text-nowrap">${counts ? `${counts.submitted} / ${counts.total}` : '<span class="text-muted">—</span>'}</td>
            <td class="text-nowrap text-end">
                <a href="${drilldown}" class="btn btn-sm btn-outline-primary">Submissions</a>
                <a href="/assignments/${encodeURIComponent(a.id)}" class="btn btn-sm btn-outline-secondary">Edit</a>
            </td>
        </tr>`;
}

function linkChip(link) {
    const stateBadges = {
        DRAFT: '<span class="badge text-bg-warning">Draft</span>',
        ASSIGNED: '<span class="badge text-bg-success">Assigned</span>',
        PUBLISHED: '<span class="badge text-bg-success">Assigned</span>',
        DELETED: '<span class="badge text-bg-secondary">Deleted</span>',
    };
    const name = COURSE_NAMES[link.course_id] || link.course_id;
    return `<span class="text-nowrap">${escapeHtml(name)} ${stateBadges[link.state] || ''}</span>`;
}

function assignedRowHtml({ assignment: a }) {
    return `
        <a href="/a/${encodeURIComponent(a.id)}" class="list-group-item list-group-item-action">
            <div class="d-flex justify-content-between align-items-center">
                <span class="fw-semibold">${escapeHtml(a.title)}</span>
                <span class="badge bg-success">Assigned to you</span>
            </div>
            <small class="text-muted">${a.questions.length} questions · by your teacher</small>
        </a>`;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function timestamp(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('en-SG', { year: 'numeric', month: 'short', day: 'numeric' });
}

// Load on page view
loadAssignments();
</script>
{% endblock %}
