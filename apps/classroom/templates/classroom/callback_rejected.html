{% extends "base.html" %}

{% block title %}Connection Refused - Campus Classroom{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 640px;">
    <div class="card border-danger">
        <div class="card-body text-center py-5">
            <i class="bi bi-shield-x text-danger" style="font-size: 3rem;"></i>
            <h1 class="h4 mt-3">Google Classroom connection refused</h1>
            <p class="text-muted mb-4">{{ reason }}</p>
            <a class="btn btn-outline-primary" href="{{ url_for('classroom_auth.connection') }}">
                Back to Classroom connection
            </a>
        </div>
    </div>
</div>
{% endblock %}
