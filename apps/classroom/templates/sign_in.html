{% extends "base.html" %}

{% block title %}Sign In - Campus Classroom{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
                                <i class="bi bi-mortarboard-fill fs-3"></i>
                            </div>
                            <h2 class="mb-2">Sign In</h2>
                            <p class="text-muted">Access your Campus Classroom account</p>
                        </div>

                        <div class="d-grid">
                            <a href="{{ url_for('auth.login', next=url_for('dashboard')) }}" class="btn btn-primary btn-lg">
                                <i class="bi bi-box-arrow-in-right me-2"></i>
                                Sign In with Campus Account
                            </a>
                        </div>

                        <hr class="my-4">

                        <div class="text-center">
                            <p class="text-muted mb-2">
                                <small>Part of the Campus ecosystem</small>
                            </p>
                            <a href="https://github.com/nyjc-computing/campus-classroom" class="text-decoration-none text-muted">
                                <i class="bi bi-github me-1"></i>
                                Learn more
                            </a>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <a href="/" class="text-decoration-none text-muted">
                        <i class="bi bi-arrow-left me-1"></i>
                        Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
