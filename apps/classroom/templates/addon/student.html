<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student View - Campus Classroom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div id="student-view">
        <div class="text-center py-5">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">Loading assignment...</p>
        </div>
    </div>

    <script>
        // Context passed from backend
        const context = {{ context | tojson }};
        const userId = {{ user_id | tojson }};

        // Notify parent Classroom of content height
        function resizeIframe() {
            const height = document.body.scrollHeight;
            if (window.parent !== window) {
                window.parent.postMessage({
                    action: 'resize',
                    height: height
                }, '*');
            }
        }

        // Load and display assignment
        async function loadAssignment() {
            const container = document.getElementById('student-view');

            // First, get the assignment ID from context
            // In production, this comes from the attachment metadata
            // For testing, we'll use the first assignment found

            try {
                // Get submissions for this user in this course
                const response = await fetch(`/api/v1/submissions/for-student?course_id=${context.courseId}`);
                if (!response.ok) throw new Error('Failed to load submission');

                if (response.status === 404) {
                    // No submission yet - need to create one
                    container.innerHTML = `
                        <div class="p-3">
                            <div class="alert alert-info">
                                <strong>No assignment found.</strong>
                                Please complete the setup in Google Classroom first.
                            </div>
                            <p class="text-muted small">
                                <strong>Course ID:</strong> ${context.courseId}<br>
                                <strong>Item ID:</strong> ${context.itemId}
                            </p>
                        </div>
                    `;
                    return;
                }

                const submission = await response.json();

                // Load the assignment details
                const assignmentResp = await fetch(`/api/v1/assignments/${submission.assignment_id}`);
                if (!assignmentResp.ok) throw new Error('Failed to load assignment');

                const assignment = await assignmentResp.json();

                renderAssignment(assignment, submission);
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `
                    <div class="p-3">
                        <div class="alert alert-warning">
                            Could not load assignment. Please try again.
                        </div>
                    </div>
                `;
            }
        }

        function renderAssignment(assignment, submission) {
            const container = document.getElementById('student-view');

            container.innerHTML = `
                <div class="p-3">
                    <h5>${escapeHtml(assignment.title)}</h5>
                    ${assignment.description ? `<p class="text-muted mb-3">${escapeHtml(assignment.description)}</p>` : ''}

                    <hr>

                    ${assignment.questions.map(q => renderQuestion(q, submission)).join('')}

                    ${!submission.submitted_at ? `
                        <div class="d-grid mt-4">
                            <button type="button" class="btn btn-primary" onclick="submitSubmission()">Submit Assignment</button>
                        </div>
                    ` : `
                        <div class="alert alert-success mt-4">
                            Submitted on ${new Date(submission.submitted_at).toLocaleDateString()}
                        </div>
                    `}
                </div>
            `;

            resizeIframe();
        }

        function renderQuestion(q, submission) {
            const response = submission.responses.find(r => r.question_id === q.id);
            const level = q.id.split('.').length;
            const indent = (level - 1) * 24;

            return `
                <div class="question-item mb-3 p-2" style="margin-left: ${indent}px">
                    <strong>${escapeHtml(q.id)}</strong>
                    ${q.prompt ? `<p class="text-muted small mb-2">${escapeHtml(q.prompt)}</p>` : ''}
                    <p class="mb-2">${escapeHtml(q.question)}</p>

                    <textarea
                        class="form-control"
                        id="response-${q.id}"
                        rows="3"
                        ${submission.submitted_at ? 'disabled' : ''}
                        onchange="autoSave('${q.id}', this.value)">${response ? escapeHtml(response.response_text || '') : ''}</textarea>
                </div>
            `;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        let autoSaveTimeout = null;

        function autoSave(questionId, value) {
            clearTimeout(autoSaveTimeout);
            autoSaveTimeout = setTimeout(async () => {
                // TODO: Implement save
                console.log('Auto-saving response for', questionId);
            }, 1000);
        }

        async function submitSubmission() {
            if (!confirm('Are you sure you want to submit your assignment?')) {
                return;
            }

            // TODO: Implement submit
            alert('Submit functionality coming soon');
        }

        // Initialize
        loadAssignment();
        window.addEventListener('resize', resizeIframe);
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
        }
    </style>
</body>
</html>
