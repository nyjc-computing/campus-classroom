<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review - Campus Classroom</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div id="review-view">
        <div class="text-center py-5">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">Loading submission...</p>
        </div>
    </div>

    <script>
        // Context passed from backend
        const context = {{ context | tojson }};
        const userId = {{ user_id | tojson }};

        function resizeIframe() {
            const height = document.body.scrollHeight;
            if (window.parent !== window) {
                window.parent.postMessage({
                    action: 'resize',
                    height: height
                }, '*');
            }
        }

        async function loadSubmission() {
            const container = document.getElementById('review-view');

            container.innerHTML = `
                <div class="p-3">
                    <h6 class="mb-3">Classroom Context:</h6>
                    <div class="bg-light p-3 rounded mb-4">
                        <p><strong>Course ID:</strong> ${context.courseId}</p>
                        <p><strong>Item ID:</strong> ${context.itemId}</p>
                        <p><strong>Submission ID:</strong> ${context.submissionId || 'N/A'}</p>
                    </div>

                    <div class="alert alert-info">
                        Student Work Review is under development.
                        This view will show student responses and allow teacher feedback.
                    </div>
                </div>
            `;

            resizeIframe();
        }

        // Initialize
        loadSubmission();
        window.addEventListener('resize', resizeIframe);
    </script>

    <style>
        body {
            margin: 0;
            padding: 0;
        }
    </style>
</body>
</html>
