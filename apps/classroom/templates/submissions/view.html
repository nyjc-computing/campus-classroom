{% extends "base.html" %}

{% block title %}Submission{% endblock %}

{% block content %}
<div class="container-md mt-4">
    <div id="submission-loading" class="text-center py-5">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div id="submission-container" class="d-none"></div>
</div>

{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/api-errors.js') }}"></script>
<script>
const submissionId = {{ submission_id | tojson }};

async function loadSubmission() {
    try {
        const response = await fetch(`/api/v1/submissions/${submissionId}`);
        if (!response.ok) {
            // A dead Campus grant (#98) answers 401 here: re-auth is the
            // only remedy, so redirect before any generic error UI.
            const data = await response.json().catch(() => ({}));
            if (handleSessionExpiry(response, data)) return;
            throw new Error('Failed to load submission');
        }

        const submission = await response.json();
        const container = document.getElementById('submission-container');

        // Also load assignment details for questions
        const assignmentResp = await fetch(`/api/v1/assignments/${submission.assignment_id}`);
        if (!assignmentResp.ok) {
            const data = await assignmentResp.json().catch(() => ({}));
            if (handleSessionExpiry(assignmentResp, data)) return;
            throw new Error('Failed to load assignment');
        }

        const assignment = await assignmentResp.json();

        container.innerHTML = `
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="{{ url_for('assignments_list') }}">Assignments</a></li>
                    <li class="breadcrumb-item">${escapeHtml(assignment.title)}</li>
                    <li class="breadcrumb-item active">Submission</li>
                </ol>
            </nav>

            ${submission.feedback && submission.feedback.length > 0 ? `
                <div class="alert alert-info mb-4">
                    <strong>Teacher Feedback Provided</strong>
                    <p class="mb-0 small">Your teacher has provided feedback on this assignment.</p>
                </div>
            ` : ''}

            <div class="submission-header mb-4">
                <h4>Student Responses</h4>
                <p class="text-muted">
                    Status: ${submission.submitted_at ? 'Submitted' : 'Draft'}
                    ${submission.updated_at ? `| Last updated: ${timestamp(submission.updated_at)}` : ''}
                </p>
            </div>

            <div class="questions-responses mb-4">
                ${assignment.questions.map(q => renderQuestionWithResponse(q, submission)).join('')}
            </div>

            ${!submission.submitted_at ? `
                <div class="d-grid gap-2 mt-4">
                    <button type="button" class="btn btn-primary" onclick="submitSubmission()">Submit Assignment</button>
                </div>
            ` : ''}
        `;

        document.getElementById('submission-loading').classList.add('d-none');
        document.getElementById('submission-container').classList.remove('d-none');
    } catch (error) {
        console.error('Error loading submission:', error);
        document.getElementById('submission-container').innerHTML = `
            <div class="alert alert-danger">Failed to load submission. Please <a href="{{ url_for('assignments_list') }}">go back</a>.</div>
        `;
        document.getElementById('submission-loading').classList.add('d-none');
        document.getElementById('submission-container').classList.remove('d-none');
    }
}

// Document snapshots (#78) are kept out of the template strings (a
// multi-MB srcdoc does not belong in an attribute) and rendered into a
// script-disabled iframe only on demand.
const SNAPSHOT_HTML = {};

function renderQuestionWithResponse(q, submission) {
    if ((q.type || 'free-response') === 'document') {
        return renderDocumentResponse(q, submission);
    }
    const response = submission.responses.find(r => r.question_id === q.id);
    const feedback = submission.feedback.find(f => f.question_id === q.id);
    const level = q.id.split('.').length;
    const indent = (level - 1) * 24;

    return `
        <div class="question-item mb-4 p-3" style="margin-left: ${indent}px">
            <div>
                <strong>${escapeHtml(q.id)}</strong>
                ${q.prompt ? `<p class="text-muted small mb-2">${escapeHtml(q.prompt)}</p>` : ''}
                <p class="mb-2">${escapeHtml(q.question)}</p>
            </div>

            <div class="response-box">
                <label class="form-label text-muted small">Your Response:</label>
                <textarea
                    class="form-control"
                    id="response-${q.id}"
                    rows="3"
                    ${submission.submitted_at ? 'disabled' : ''}
                    placeholder="${submission.submitted_at ? 'No response provided' : 'Type your response...'}"
                    onchange="autoSave('${q.id}', this.value)">${escapeHtml(response?.response_text || '')}</textarea>
            </div>

            ${feedback ? `
                <div class="feedback-box">
                    <label class="form-label text-muted small">Teacher Feedback:</label>
                    <div class="feedback-content p-3 bg-light border rounded">
                        ${escapeHtml(feedback.feedback_text)}
                        <div class="text-muted small mt-2">
                            ${feedback.teacher_id} | ${timestamp(feedback.created_at)}
                        </div>
                    </div>
                </div>
            ` : ''}
        </div>
    `;
}

function renderDocumentResponse(q, submission) {
    const response = submission.responses.find(r => r.question_id === q.id);
    const feedback = submission.feedback.find(f => f.question_id === q.id);
    const level = q.id.split('.').length;
    const indent = (level - 1) * 24;
    const html = (response && response.response_data && response.response_data.html) || '';
    let snapshotBlock;
    if (html) {
        SNAPSHOT_HTML[q.id] = html;
        snapshotBlock = `
            <details class="doc-snapshot mt-1">
                <summary class="small text-muted">View the student's exported document
                    (${Math.max(1, Math.round(html.length / 1024))} KB — script-free snapshot)</summary>
                <button type="button" class="btn btn-sm btn-outline-secondary mt-2"
                        onclick="loadSnapshot('${q.id}')">Render snapshot</button>
                <div class="snapshot-frame-box mt-2" id="snapshot-${q.id}"></div>
            </details>`;
    } else {
        snapshotBlock = `<div class="small text-muted mt-1">No exported document snapshot.</div>`;
    }

    return `
        <div class="question-item mb-4 p-3" style="margin-left: ${indent}px">
            <div>
                <strong>${escapeHtml(q.id)}</strong>
                <span class="badge text-bg-light border ms-1">Interactive document</span>
                ${q.prompt ? `<p class="text-muted small mb-2">${escapeHtml(q.prompt)}</p>` : ''}
                <p class="mb-2">${escapeHtml(q.question)}</p>
            </div>

            <div class="response-box">
                <label class="form-label text-muted small">Student's exported document:</label>
                ${snapshotBlock}
            </div>

            ${feedback ? `
                <div class="feedback-box">
                    <label class="form-label text-muted small">Teacher Feedback:</label>
                    <div class="feedback-content p-3 bg-light border rounded">
                        ${escapeHtml(feedback.feedback_text)}
                        <div class="text-muted small mt-2">
                            ${feedback.teacher_id} | ${timestamp(feedback.created_at)}
                        </div>
                    </div>
                </div>
            ` : ''}
        </div>
    `;
}

function loadSnapshot(qid) {
    const box = document.getElementById('snapshot-' + qid);
    if (!box || !SNAPSHOT_HTML[qid]) return;
    box.innerHTML = '';
    const frame = document.createElement('iframe');
    // Fully script-disabled: the snapshot was already scrubbed at write;
    // the empty sandbox enforces it again at render (#78).
    frame.setAttribute('sandbox', '');
    frame.className = 'snapshot-frame';
    frame.title = 'Exported document ' + qid;
    frame.srcdoc = SNAPSHOT_HTML[qid];
    box.appendChild(frame);
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function timestamp(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString('en-SG', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

let autoSaveTimeouts = {};

function autoSave(questionId, value) {
    clearTimeout(autoSaveTimeouts[questionId]);
    autoSaveTimeouts[questionId] = setTimeout(async () => {
        await fetch(`/api/v1/submissions/${submissionId}/responses`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-Requested-With': 'XMLHttpRequest'
            },
            body: JSON.stringify({
                question_id: questionId,
                response_text: value
            })
        });
    }, 1000);
}

async function submitSubmission() {
    try {
        const response = await fetch(`/api/v1/submissions/${submissionId}/submit`, {
            method: 'POST',
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        });
        if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            if (handleSessionExpiry(response, data)) return;
            throw new Error('Failed to submit');
        }

        alert('Assignment submitted!');
        location.reload();
    } catch (error) {
        console.error('Error submitting:', error);
        alert('Failed to submit. Please try again.');
    }
}

// Load on page view
loadSubmission();
</script>

<style>
.question-item {
    border-left: 2px solid var(--border-color);
}

.response-box, .feedback-box {
    background: #f8f9fa;
    border-radius: 8px;
    padding: 16px;
}

.response-box textarea {
    margin-bottom: 0;
}

.feedback-content {
    white-space: pre-wrap;
}

.breadcrumb-item + .breadcrumb-item::before {
    content: ">";
    margin-right: 0.5rem;
}

/* Exported document snapshot (#78): inert, script-disabled render. */
.snapshot-frame {
    width: 100%;
    height: 520px;
    border: 1px solid #dee2e6;
    border-radius: 8px;
    background: #fff;
}
</style>
{% endblock %}
