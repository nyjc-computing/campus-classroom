{% extends "base.html" %}

{% block title %}Assignment{% endblock %}

{% block content %}
<div class="container-md mt-4">
    <div id="assignment-loading" class="text-center py-5">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div id="assignment-container" class="d-none"></div>
</div>

<!-- Send-to-Classroom course picker (issue #10, PRD §6.7) -->
<div class="modal fade" id="classroomPickerModal" tabindex="-1" aria-labelledby="classroomPickerTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="classroomPickerTitle">
                    <i class="bi bi-mortarboard-fill me-2"></i>Send to Google Classroom
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="picker-loading" class="text-center py-4">
                    <div class="spinner-border spinner-border-sm" role="status">
                        <span class="visually-hidden">Loading…</span>
                    </div>
                    <span class="ms-2 text-muted">Loading your classes…</span>
                </div>
                <div id="picker-error" class="d-none"></div>
                <div id="picker-courses" class="d-none">
                    <p class="text-muted small mb-2">
                        Select one or more classes. Each gets a draft assignment
                        in Google Classroom with this assignment attached.
                    </p>
                    <div id="picker-course-list" class="list-group"></div>
                </div>
                <div id="picker-results" class="d-none"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary d-none" id="picker-send-btn" onclick="sendToClassroom()">Send to selected classes</button>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/api-errors.js') }}"></script>
<script src="{{ url_for('static', filename='js/question-builder.js') }}"></script>
<script>
const assignmentId = {{ assignment_id | tojson }};
let assignment = null;
let editing = false;

function isLocked() {
    return assignment.classroom_links && assignment.classroom_links.length > 0;
}

async function loadAssignment() {
    try {
        const response = await fetch(`/api/v1/assignments/${assignmentId}`);
        if (!response.ok) throw new Error('Failed to load assignment');

        assignment = await response.json();
        render();
    } catch (error) {
        console.error('Error loading assignment:', error);
        document.getElementById('assignment-container').innerHTML = `
            <div class="alert alert-danger">Failed to load assignment. Please <a href="{{ url_for('assignments_list') }}">go back</a>.</div>
        `;
        document.getElementById('assignment-loading').classList.add('d-none');
    }
}

function render() {
    const container = document.getElementById('assignment-container');
    container.innerHTML = `
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{{ url_for('assignments_list') }}">Assignments</a></li>
                <li class="breadcrumb-item active">${escapeHtml(assignment.title)}</li>
            </ol>
        </nav>
        ${editing ? renderEditMode() : renderViewMode()}
    `;

    if (editing) {
        populateBuilderFromFlat(assignment.questions);
        document.getElementById('edit-form').addEventListener('submit', saveEdit);
    }

    document.getElementById('assignment-loading').classList.add('d-none');
    container.classList.remove('d-none');
}

function renderViewMode() {
    return `
        <div class="card mb-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-start mb-3">
                    <h2>${escapeHtml(assignment.title)}</h2>
                </div>
                ${assignment.description ? `<p class="text-muted">${escapeHtml(assignment.description)}</p>` : ''}

                ${isLocked() ? `
                    <div class="alert alert-info">
                        This assignment is locked. Unlink from Google Classroom to edit.
                        ${assignment.classroom_links.map(link => `
                            <div class="small">
                                <strong>Course:</strong> ${escapeHtml(link.course_id)}<br>
                                <strong>Coursework:</strong> ${escapeHtml(link.coursework_id || 'N/A')} ·
                                <strong>Attachment:</strong> ${escapeHtml(link.attachment_id || 'N/A')}
                            </div>
                        `).join('')}
                    </div>
                ` : ''}

                <hr>

                <h5 class="mb-3">Questions (${assignment.questions.length})</h5>

                <div class="questions-list mb-4">
                    ${assignment.questions.map(q => renderQuestion(q)).join('')}
                </div>

                <div class="d-flex gap-2 mt-4">
                    ${!isLocked() ? `
                        <button type="button" class="btn btn-primary" onclick="startEdit()">Edit</button>
                    ` : ''}

                    <button type="button" class="btn btn-success" onclick="openClassroomPicker()">
                        <i class="bi bi-send me-1"></i>Send to Google Classroom
                    </button>

                    <a href="{{ url_for('assignments_list') }}" class="btn btn-outline-secondary">Back</a>
                </div>
            </div>
        </div>
    `;
}

function renderEditMode() {
    return `
        <form id="edit-form" class="needs-validation">
            <div class="card mb-4">
                <div class="card-body">
                    <div class="mb-3">
                        <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title" value="${escapeHtml(assignment.title || '')}" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3">${escapeHtml(assignment.description || '')}</textarea>
                    </div>

                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6>Questions</h6>
                            <button type="button" class="btn btn-sm btn-outline-primary" onclick="addTopLevelQuestion()">
                                <i class="bi bi-plus-lg me-1"></i>Add Question
                            </button>
                        </div>
                        <div id="questions-container"></div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <button type="button" class="btn btn-outline-secondary" onclick="cancelEdit()">Cancel</button>
                    </div>
                </div>
            </div>
        </form>
    `;
}

function startEdit() {
    editing = true;
    render();
}

function cancelEdit() {
    editing = false;
    render();
}

async function saveEdit(e) {
    e.preventDefault();

    const form = e.target;
    const title = form.title.value.trim();
    const description = form.description.value.trim();

    if (!title) {
        alert('Title is required');
        return;
    }

    const questions = collectValidatedQuestions();
    if (!questions) return;

    try {
        const response = await fetch(`/api/v1/assignments/${assignmentId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                title: title,
                description: description || null,
                questions: questions
            })
        });

        if (!response.ok) {
            const err = await response.json().catch(() => ({}));
            throw new Error(formatApiError(err, 'Failed to save assignment'));
        }

        assignment = await response.json();
        editing = false;
        render();
    } catch (error) {
        console.error('Error saving assignment:', error);
        alert(error.message || 'Failed to save assignment. Please try again.');
    }
}

function renderQuestion(q) {
    const level = q.id.split('.').length;
    const indent = (level - 1) * 24;

    return `
        <div class="question-item mb-3 p-3" style="margin-left: ${indent}px">
            <strong>${escapeHtml(q.id)}</strong>
            ${q.prompt ? `<p class="text-muted small mb-2">${escapeHtml(q.prompt)}</p>` : ''}
            <p>${escapeHtml(q.question)}</p>
        </div>
    `;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// --- Send to Google Classroom (issue #10, PRD §6.7) ---

let pickerModal = null;
let pickerCourses = [];
let pickerCourseNames = {};

function classroomAuthorizeUrl(missing) {
    // Back to this page after the incremental consent screen.
    const params = new URLSearchParams({ next: window.location.pathname });
    if (missing && missing.length) params.set('scopes', missing.join(' '));
    return `/classroom/authorize?${params.toString()}`;
}

function showPickerError(err) {
    const box = document.getElementById('picker-error');
    const e = (err && err.error) || {};
    let html;
    if (e.code === 'classroom_not_connected') {
        html = `${escapeHtml(e.message)}
            <a href="${classroomAuthorizeUrl()}" class="btn btn-sm btn-primary mt-2">Connect Google Classroom</a>`;
    } else if (e.code === 'classroom_missing_scopes') {
        html = `${escapeHtml(e.message)}
            <a href="${classroomAuthorizeUrl(e.missing_scopes)}" class="btn btn-sm btn-primary mt-2">Grant permission</a>`;
    } else {
        html = escapeHtml(e.message || 'Could not reach Google Classroom.');
    }
    box.innerHTML = html;
    box.classList.remove('d-none');
    document.getElementById('picker-loading').classList.add('d-none');
    document.getElementById('picker-courses').classList.add('d-none');
    document.getElementById('picker-results').classList.add('d-none');
    document.getElementById('picker-send-btn').classList.add('d-none');
}

function resetPicker() {
    document.getElementById('picker-error').classList.add('d-none');
    document.getElementById('picker-courses').classList.add('d-none');
    document.getElementById('picker-results').classList.add('d-none');
    document.getElementById('picker-send-btn').classList.add('d-none');
    document.getElementById('picker-loading').classList.remove('d-none');
    const btn = document.getElementById('picker-send-btn');
    btn.disabled = false;
    btn.textContent = 'Send to selected classes';
}

async function openClassroomPicker() {
    pickerModal = pickerModal || new bootstrap.Modal('#classroomPickerModal');
    resetPicker();
    pickerModal.show();
    loadCourses();
}

async function loadCourses() {
    try {
        const response = await fetch('/api/v1/classroom/courses');
        if (!response.ok) {
            showPickerError(await response.json().catch(() => ({})));
            return;
        }
        const data = await response.json();
        const linked = new Set((assignment.classroom_links || []).map(l => l.course_id));
        pickerCourseNames = Object.fromEntries(data.courses.map(c => [c.id, c.name]));
        pickerCourses = data.courses.filter(c => !linked.has(c.id));
        renderCourseList();
    } catch (error) {
        console.error('Error loading Classroom courses:', error);
        showPickerError({});
    }
}

function renderCourseList() {
    document.getElementById('picker-loading').classList.add('d-none');

    if (!pickerCourses.length) {
        showPickerError({ error: { message: 'All of your classes already have this assignment posted.' } });
        return;
    }

    document.getElementById('picker-course-list').innerHTML = pickerCourses.map(c => `
        <label class="list-group-item list-group-item-action">
            <input class="form-check-input me-2 picker-course" type="checkbox" value="${escapeHtml(c.id)}">
            ${escapeHtml(c.name || c.id)}${c.section ? `<span class="text-muted ms-1">· ${escapeHtml(c.section)}</span>` : ''}
        </label>
    `).join('');
    document.getElementById('picker-courses').classList.remove('d-none');
    updateSendButton();
}

function updateSendButton() {
    const any = document.querySelectorAll('.picker-course:checked').length > 0;
    document.getElementById('picker-send-btn').disabled = !any;
}

async function sendToClassroom() {
    const courseIds = [...document.querySelectorAll('.picker-course:checked')].map(cb => cb.value);
    if (!courseIds.length) return;

    const btn = document.getElementById('picker-send-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Sending…';

    try {
        const response = await fetch(`/api/v1/assignments/${assignmentId}/classroom/send`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ course_ids: courseIds })
        });

        if (!response.ok) {
            showPickerError(await response.json().catch(() => ({})));
            return;
        }

        const data = await response.json();
        renderSendResults(data.results || []);
        // Re-fetch so the lock banner and classroom_links reflect the send.
        await loadAssignment();
    } catch (error) {
        console.error('Error sending to Classroom:', error);
        showPickerError({ error: { message: 'Sending failed. Please try again.' } });
    } finally {
        btn.disabled = false;
        btn.textContent = 'Send to selected classes';
    }
}

const PICKER_ICONS = {
    attached: 'bi-check-circle-fill text-success',
    linked: 'bi-link-45deg text-success',
    already_linked: 'bi-check2 text-muted',
    error: 'bi-exclamation-triangle-fill text-danger'
};
const PICKER_LABELS = {
    attached: 'Posted with add-on attachment',
    linked: 'Posted with assignment link',
    already_linked: 'Already posted',
    error: 'Failed'
};

function renderSendResults(results) {
    document.getElementById('picker-courses').classList.add('d-none');
    const box = document.getElementById('picker-results');
    box.innerHTML = '<h6 class="mb-3">Result</h6>' + results.map(r => `
        <div class="d-flex align-items-start mb-2">
            <i class="bi ${PICKER_ICONS[r.status] || PICKER_ICONS.error} me-2 mt-1"></i>
            <div>
                <div>${escapeHtml(pickerCourseNames[r.course_id] || r.course_id)}</div>
                <div class="small text-muted">
                    ${PICKER_LABELS[r.status] || r.status}${r.message ? ` — ${escapeHtml(r.message)}` : ''}
                </div>
            </div>
        </div>
    `).join('');
    box.classList.remove('d-none');
    document.getElementById('picker-send-btn').classList.add('d-none');
}

document.getElementById('picker-course-list').addEventListener('change', updateSendButton);

// Load on page view
loadAssignment();
</script>

<style>
.question-item {
    border-left: 2px solid var(--border-color);
}

.breadcrumb-item + .breadcrumb-item::before {
    content: ">";
    margin-right: 0.5rem;
}

#questions-container .question-prompt, #questions-container .question-text {
    font-family: monospace;
    font-size: 0.9rem;
}
</style>
{% endblock %}
