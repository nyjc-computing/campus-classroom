{% extends "base.html" %}

{% block title %}New Assignment{% endblock %}

{% block content %}
<div class="container-md mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="mb-4">Create New Assignment</h2>

            <form id="assignment-form" class="needs-validation">
                <div class="mb-3">
                    <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="title" name="title" required>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="3"></textarea>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <h6>Questions</h6>
                        <button type="button" class="btn btn-sm btn-outline-primary" onclick="addTopLevelQuestion()">
                            <i class="bi bi-plus-lg me-1"></i>Add Question
                        </button>
                    </div>
                    <div id="questions-container"></div>
                </div>

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">Create Assignment</button>
                    <a href="{{ url_for('assignments_list') }}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/api-errors.js') }}"></script>
<script src="{{ url_for('static', filename='js/question-builder.js') }}"></script>
<script>
// Submit assignment
async function submitAssignment(e) {
    e.preventDefault();

    const form = e.target;
    const title = form.title.value.trim();
    const description = form.description.value.trim();

    if (!title) {
        alert('Title is required');
        return;
    }

    const questions = collectValidatedQuestions();
    if (!questions) return;

    const payload = {
        title: title,
        description: description || null,
        questions: questions
    };

    try {
        const response = await fetch('/api/v1/assignments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (!response.ok) {
            const err = await response.json().catch(() => ({}));
            throw new Error(formatApiError(err, 'Failed to create assignment'));
        }

        const data = await response.json();
        window.location.href = `/assignments/${data.id}`;
    } catch (error) {
        console.error('Error creating assignment:', error);
        alert('Failed to create assignment. Please try again.');
    }
}

document.getElementById('assignment-form').addEventListener('submit', submitAssignment);
</script>

<style>
.question-prompt, .question-text {
    font-family: monospace;
    font-size: 0.9rem;
}
</style>
{% endblock %}
